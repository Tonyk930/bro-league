<style>

button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:245px;border-right:1px solid var(--line);padding:24px 16px;position:fixed;height:100vh;background:#0b0c10}.logo{font-weight:900;font-size:23px;letter-spacing:1px;padding:8px 12px 28px}.logo span{color:var(--a)}nav button{display:block;width:100%;text-align:left;background:transparent;color:#aeb5c2;padding:12px 14px;border-radius:10px;margin:4px 0}nav button.active,nav button:hover{background:#191522;color:white}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.title h1{margin:0;font-size:30px}.title p{color:var(--muted);margin:7px 0 0}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:#bfc6d2;font-size:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:linear-gradient(145deg,#13161d,#0e1015);border:1px solid var(--line);border-radius:16px;padding:20px}.metric{min-height:160px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-35px;top:-40px;background:var(--a);opacity:.10;filter:blur(3px)}.metric:nth-child(2):after{background:var(--b)}.metric:nth-child(3):after{background:var(--good)}.eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--muted);font-weight:800}.big{font-size:34px;font-weight:900;margin:15px 0 8px}.leader{color:#bfc6d2;font-size:13px}.section{margin-top:24px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{font-size:17px;margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button,.primary,.danger{padding:9px 13px;border-radius:9px;background:#191c24;color:#b9c0cb;border:1px solid var(--line)}.tabs button.on,.primary{background:var(--a);color:#fff;border-color:var(--a)}.danger{background:#2a1219;color:#ff9eb0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:#737d8c;font-size:11px;text-transform:uppercase}.rank{font-weight:900;width:40px}.bar{height:6px;background:#242933;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:20px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;background:#0c0e13;color:white;border:1px solid var(--line);border-radius:9px;padding:11px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:13px}.empty{color:var(--muted);padding:22px 0}.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}.duel{text-align:center}.avatar{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;background:#24202e;border:1px solid #3a3150;font-weight:900}.score{font-size:28px;font-weight:900;margin-top:10px}.vs{font-weight:900;color:#666f7d}.notice{padding:12px 14px;background:#10151b;border:1px solid var(--line);border-radius:10px;color:#aab2bf;font-size:12px}.hidden{display:none}.authbox{max-width:520px;margin:50px auto}.authbox h2{margin-top:0}.logout{margin-left:8px}.admin-only{display:none}.adminbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:16px}.userpill{padding:7px 10px;border:1px solid var(--line);border-radius:99px;color:#bfc6d2;font-size:12px}.mini{padding:7px 10px!important;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#1c2029;border:1px solid var(--line);padding:12px 16px;border-radius:10px;display:none}
@media(max-width:900px){.side{width:70px}.logo{font-size:0}.logo:after{content:"BL";font-size:18px}.side nav button{font-size:0;text-align:center}.side nav button:before{content:"•";font-size:18px}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.grid3,.grid2{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}

<script>
const SUPABASE_URL="https://rffifgnxrdiacklahpau.supabase.co";
const SUPABASE_KEY="sb_publishable_b3shv7MabRAVeeEuXGyAYw_A0HA0e_Q";
let currentSession=null;
let authChecked=false;
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const metrics={retention:"RETENTION",deposits:"DEPOSITS",tubes:"ТРУБКИ"};
const metricTables={retention:"retention",deposits:"deposits",tubes:"calls"};
let teams={},teamRows=[],managerRows=[];
let data={values:{},managerIds:{},teamIds:{},versus:[],bonuses:[]};
function fmt(v){return Number(v||0).toLocaleString("ru-RU")}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display="none",2200)}
function teamKey(n){return n.replace(/^Команда\s+/i,"")}
function teamOf(n){return Object.keys(teams).find(t=>(teams[t]||[]).includes(n))||"—"}
function ranks(m){return Object.entries(data.values).sort((a,b)=>(b[1][m]||0)-(a[1][m]||0))}
function teamRanks(m){return Object.keys(teams).map(t=>[t,(teams[t]||[]).reduce((s,n)=>s+(Number(data.values[n]?.[m])||0),0)]).sort((a,b)=>b[1]-a[1])}
async function loadData(){
 try{
  let [tr,mr,rr,dr,cr,vr,br]=await Promise.all([
   supabaseClient.from("teams").select("id,name,active").order("id"),
   supabaseClient.from("managers").select("id,name,team_id,active").order("id"),
   supabaseClient.from("retention").select("id,manager_id,value,created_at").order("created_at",{ascending:true}),
   supabaseClient.from("deposits").select("id,manager_id,value,created_at").order("created_at",{ascending:true}),
   supabaseClient.from("calls").select("id,manager_id,value,created_at").order("created_at",{ascending:true}),
   supabaseClient.from("versus").select("*").order("match_date",{ascending:false}),
   supabaseClient.from("bonuses").select("*").order("created_at",{ascending:false})
  ]);
  let errs=[tr,mr,rr,dr,cr,vr,br].filter(x=>x.error);if(errs.length)throw new Error(errs.map(x=>x.error.message).join("; "));
  teamRows=tr.data||[];managerRows=mr.data||[];teams={};data.values={};data.managerIds={};data.teamIds={};
  teamRows.forEach(t=>{let k=teamKey(t.name);teams[k]=[];data.teamIds[k]=t.id});
  managerRows.forEach(m=>{let t=teamRows.find(x=>x.id===m.team_id),k=t?teamKey(t.name):"Без команды";if(!teams[k])teams[k]=[];if(m.active!==false && t?.active!==false) teams[k].push(m.name);data.managerIds[m.name]=m.id;data.values[m.name]={retention:0,deposits:0,tubes:0}});
  function latest(rows,m){let x={};(rows||[]).forEach(r=>x[r.manager_id]=r);Object.values(x).forEach(r=>{let n=managerRows.find(q=>q.id===r.manager_id)?.name;if(n)data.values[n][m]=Number(r.value)||0})}
  latest(rr.data,"retention");latest(dr.data,"deposits");latest(cr.data,"tubes");
  data.versus=(vr.data||[]).map(v=>({id:v.id,p1:managerRows.find(m=>m.id===v.manager1_id)?.name,p2:managerRows.find(m=>m.id===v.manager2_id)?.name,metric:v.metric,date:v.match_date})).filter(v=>v.p1&&v.p2);
  data.bonuses=(br.data||[]).map(b=>({id:b.id,targetType:b.recipient_type,target:b.manager_id?managerRows.find(m=>m.id===b.manager_id)?.name:b.team_id?teamKey(teamRows.find(t=>t.id===b.team_id)?.name||""):null,title:b.title,condition:b.condition||"",reward:b.reward||"",dateTo:b.end_date||"",active:b.active!==false}));
  document.querySelector(".pill").textContent="LIVE DATA · SUPABASE";render();
 }catch(e){console.error(e);document.querySelector(".pill").textContent="SUPABASE · ERROR";document.getElementById("content").innerHTML=`<div class="card"><h2>Ошибка подключения</h2><div class="notice">${e.message}</div><div class="actions"><button class="primary" onclick="loadData()">Повторить</button></div></div>`}
}
async function initAuth(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  currentSession=session; authChecked=true; render();
  supabaseClient.auth.onAuthStateChange((_event,session)=>{currentSession=session;render();});
}
function isAdmin(){return !!currentSession}
async function loginAdmin(){
  const email=document.getElementById("loginEmail")?.value.trim();
  const password=document.getElementById("loginPassword")?.value;
  if(!email||!password){toast("Введите email и пароль");return}
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){toast("Ошибка входа: "+error.message);return}
  toast("Вход выполнен");
}
async function logoutAdmin(){await supabaseClient.auth.signOut();toast("Вы вышли из админки");}
function loginPage(){return `<div class="card authbox"><div class="eyebrow">ADMIN ACCESS</div><h2>Вход в админку</h2><p class="leader">Введите данные администратора. Аккаунты создаются через Supabase.</p><div class="form"><div class="field full"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="admin@example.com"></div><div class="field full"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div></div><div class="actions"><button class="primary" onclick="loginAdmin()">Войти</button></div></div>`}
function render(){let page=location.hash.slice(1)||"home";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let titles={home:["BRO LEAGUE","Три независимых направления. Один рабочий дашборд."],league:["LEAGUE","Отдельные рейтинги по каждому показателю."],versus:["VERSUS","Личные дуэли с выбором направления."],bonuses:["БОНУСЫ","Активные бонусы менеджеров и команд."],teams:["КОМАНДЫ","Составы и показатели команд."],admin:["АДМИНКА","Управление данными и администраторами."]};document.getElementById("pageTitle").textContent=titles[page]?.[0]||"BRO LEAGUE";document.getElementById("pageSub").textContent=titles[page]?.[1]||"";let pill=document.getElementById("statusPill");if(pill)pill.textContent=currentSession?"ADMIN · ONLINE":"LIVE DATA · SUPABASE";if(page==="admin"&&!isAdmin()){document.getElementById("content").innerHTML=loginPage();return}document.getElementById("content").innerHTML=pages[page]?pages[page]():pages.home();if(page==="league")document.querySelector("#leagueTabs button")?.click();if(page==="versus")document.querySelector("#vTabs button")?.click();if(page==="teams")document.querySelector("#tTabs button")?.click()}
const metricCard=m=>{let r=ranks(m),leader=r[0],sum=r.reduce((s,x)=>s+(Number(x[1][m])||0),0);return `<div class="card metric"><div class="eyebrow">${metrics[m]}</div><div class="big">${fmt(sum)}</div><div class="leader">Лидер: <b>${leader?.[0]||"—"}</b> · ${fmt(leader?.[1]?.[m]||0)}</div></div>`};
function miniRank(m){let r=ranks(m).slice(0,5),max=Number(r[0]?.[1][m])||1;return `<div class="card"><div class="sectionhead"><h2>${metrics[m]}</h2><span class="pill">ТОП 5</span></div><table class="table"><tbody>${r.map((x,i)=>`<tr><td class="rank">${i+1}</td><td><b>${x[0]}</b><div class="bar"><i style="width:${Math.max(2,(Number(x[1][m])||0)/max*100)}%"></i></div></td><td>${fmt(x[1][m])}</td></tr>`).join("")}</tbody></table></div>`}
const pages={
 home:()=>`<div class="grid3">${metricCard("retention")}${metricCard("deposits")}${metricCard("tubes")}</div><div class="section"><div class="sectionhead"><h2>Лидеры по направлениям</h2></div><div class="grid3">${miniRank("retention")}${miniRank("deposits")}${miniRank("tubes")}</div></div>`,
 league:()=>`<div class="tabs" id="leagueTabs">${Object.keys(metrics).map((m,i)=>`<button class="${i===0?"on":""}" onclick="showLeague('${m}',this)">${metrics[m]}</button>`).join("")}</div><div id="leagueBox" class="section"></div>`,
 versus:()=>`<div class="tabs" id="vTabs">${["all",...Object.keys(metrics)].map((m,i)=>`<button class="${i===0?"on":""}" onclick="showVersus('${m}',this)">${m==="all"?"ВСЕ":metrics[m]}</button>`).join("")}</div><div id="versusBox" class="section"></div>`,
 teams:()=>`<div class="tabs" id="tTabs">${Object.keys(metrics).map((m,i)=>`<button class="${i===0?"on":""}" onclick="showTeams('${m}',this)">${metrics[m]}</button>`).join("")}</div><div id="teamsBox" class="section"></div>`,
 bonuses:()=>`<div class="card"><div class="sectionhead"><h2>Активные бонусы</h2><span class="pill">ДЛЯ МЕНЕДЖЕРОВ И КОМАНД</span></div>${data.bonuses.filter(b=>b.active&&(!b.dateTo||b.dateTo>=new Date().toISOString().slice(0,10))).length?data.bonuses.filter(b=>b.active&&(!b.dateTo||b.dateTo>=new Date().toISOString().slice(0,10))).map(b=>`<div class="card" style="margin-bottom:10px;background:#0c0e13"><div class="eyebrow">${bonusRecipient(b)} · до ${b.dateTo||"бессрочно"}</div><div class="big" style="font-size:22px">${b.title}</div><div class="leader">${b.condition||"Условия не указаны"}</div><div style="margin-top:10px;font-weight:800">${b.reward||"Награда не указана"}</div></div>`).join(""):"<div class=\"empty\">Активных бонусов пока нет.</div>"}</div>`,
 admin:()=>`<div class="adminbar"><span class="userpill">${currentSession?.user?.email||"Администратор"}</span><button class="danger mini" onclick="logoutAdmin()">Выйти</button></div>
<div class="grid2"><div class="card"><div class="sectionhead"><h2>Результат</h2></div><div class="form"><div class="field"><label>Менеджер</label><select id="aManager">${activeManagers().map(n=>`<option>${n}</option>`).join("")}</select></div><div class="field"><label>Направление</label><select id="aMetric">${Object.entries(metrics).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div><div class="field full"><label>Значение</label><input id="aValue" type="number" min="0" placeholder="Введите значение"></div></div><div class="actions"><button class="primary" onclick="setResult()">Сохранить результат</button></div></div>
<div class="card"><div class="sectionhead"><h2>Создать VERSUS</h2></div><div class="form"><div class="field"><label>Менеджер 1</label><select id="v1">${activeManagers().map(n=>`<option>${n}</option>`).join("")}</select></div><div class="field"><label>Менеджер 2</label><select id="v2">${activeManagers().map(n=>`<option>${n}</option>`).join("")}</select></div><div class="field"><label>Направление</label><select id="vMetric">${Object.entries(metrics).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div><div class="field"><label>Дата</label><input id="vDate" type="date"></div></div><div class="actions"><button class="primary" onclick="addVersus()">Создать дуэль</button></div></div></div>
<div class="section card"><div class="sectionhead"><h2>Менеджеры</h2><span class="pill">${managerRows.filter(m=>m.active!==false).length} активных</span></div><div class="form"><div class="field"><label>Имя нового менеджера</label><input id="newManagerName" placeholder="Имя"></div><div class="field"><label>Команда</label><select id="newManagerTeam">${teamRows.filter(t=>t.active!==false).map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select></div></div><div class="actions"><button class="primary" onclick="addManager()">Добавить менеджера</button></div><div style="margin-top:15px">${managerRows.map(m=>`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><span><b>${m.name}</b><br><small style="color:var(--muted)">${teamRows.find(t=>t.id===m.team_id)?.name||"Без команды"} · ${m.active===false?"архив":"активен"}</small></span><span class="actions" style="margin:0"><button class="tabs button" onclick="renameManager(${m.id},'${escapeJs(m.name)}')">Переименовать</button><button class="tabs button" onclick="moveManager(${m.id})">Команда</button>${m.active===false?`<button class="primary" onclick="setManagerActive(${m.id},true)">Вернуть</button>`:`<button class="danger" onclick="setManagerActive(${m.id},false)">В архив</button>`}</span></div>`).join("")}</div></div>
<div class="grid2 section"><div class="card"><div class="sectionhead"><h2>Команды</h2></div><div class="form"><div class="field full"><label>Название новой команды</label><input id="newTeamName" placeholder="Например: Команда Nova"></div></div><div class="actions"><button class="primary" onclick="addTeam()">Добавить команду</button></div>${teamRows.map(t=>`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><span><b>${t.name}</b><br><small style="color:var(--muted)">${t.active===false?"архив":"активна"}</small></span><span class="actions" style="margin:0"><button onclick="renameTeam(${t.id},'${escapeJs(t.name)}')">Переименовать</button>${t.active===false?`<button class="primary" onclick="setTeamActive(${t.id},true)">Вернуть</button>`:`<button class="danger" onclick="setTeamActive(${t.id},false)">В архив</button>`}</span></div>`).join("")}</div>
<div class="card"><div class="sectionhead"><h2>Создать бонус</h2></div><div class="form"><div class="field"><label>Кому назначить</label><select id="bTargetType" onchange="updateBonusTarget()"><option value="manager">Конкретному менеджеру</option><option value="all">Всем менеджерам</option><option value="team">Целой команде</option></select></div><div class="field" id="bTargetField"><label>Менеджер</label><select id="bTarget">${activeManagers().map(n=>`<option>${n}</option>`).join("")}</select></div><div class="field"><label>Название бонуса</label><input id="bTitle" placeholder="Например: Retention Boost"></div><div class="field"><label>Награда</label><input id="bReward" placeholder="Например: $300"></div><div class="field full"><label>Условие</label><input id="bCondition" placeholder="Например: Retention от 150 000"></div><div class="field"><label>Дата окончания</label><input id="bDateTo" type="date"></div></div><div class="actions"><button class="primary" onclick="addBonus()">Добавить бонус</button></div></div></div>
<div class="section card"><div class="sectionhead"><h2>Все бонусы</h2></div>${data.bonuses.length?data.bonuses.map(b=>`<div style="display:flex;justify-content:space-between;gap:15px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)"><span><b>${bonusRecipient(b)}</b> · ${b.title}<br><small style="color:var(--muted)">${b.condition||""} · ${b.reward||""} · ${b.dateTo||"без срока"}</small></span><button class="danger" onclick="removeBonus(${b.id})">Удалить</button></div>`).join(""):"<div class=\"empty\">Бонусов пока нет.</div>"}</div>
<div class="section card"><div class="sectionhead"><h2>Безопасность</h2></div><div class="notice">Админка работает через Supabase Auth. Каждый администратор получает отдельный email и пароль. Новых администраторов создавай в Authentication → Users. Обычный посетитель не сможет выполнять операции изменения данных.</div></div>`,
};
function activeManagers(){return managerRows.filter(m=>m.active!==false && teamRows.find(t=>t.id===m.team_id)?.active!==false).map(m=>m.name)}
function escapeJs(v){return String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
async function addManager(){if(!isAdmin())return;let name=document.getElementById("newManagerName").value.trim(),teamId=Number(document.getElementById("newManagerTeam").value);if(!name||!teamId){toast("Введите имя и команду");return}let {error}=await supabaseClient.from("managers").insert({name,team_id:teamId,active:true});if(error){toast("Ошибка: "+error.message);return}toast("Менеджер добавлен");await loadData()}
async function renameManager(id,old){let name=prompt("Новое имя менеджера:",old);if(!name||name.trim()===old)return;let {error}=await supabaseClient.from("managers").update({name:name.trim()}).eq("id",id);if(error){toast("Ошибка: "+error.message);return}toast("Имя изменено");await loadData()}
async function moveManager(id){let activeTeams=teamRows.filter(t=>t.active!==false);let list=activeTeams.map(t=>`${t.id}: ${t.name}`).join("\n");let v=prompt("Введите ID команды:\n\n"+list);if(v===null)return;let teamId=Number(v);if(!activeTeams.some(t=>t.id===teamId)){toast("Неверный ID команды");return}let {error}=await supabaseClient.from("managers").update({team_id:teamId}).eq("id",id);if(error){toast("Ошибка: "+error.message);return}toast("Команда изменена");await loadData()}
async function setManagerActive(id,active){let {error}=await supabaseClient.from("managers").update({active}).eq("id",id);if(error){toast("Ошибка: "+error.message);return}toast(active?"Менеджер восстановлен":"Менеджер отправлен в архив");await loadData()}
async function addTeam(){let name=document.getElementById("newTeamName").value.trim();if(!name){toast("Введите название команды");return}let {error}=await supabaseClient.from("teams").insert({name,active:true});if(error){toast("Ошибка: "+error.message);return}toast("Команда добавлена");await loadData()}
async function renameTeam(id,old){let name=prompt("Новое название команды:",old);if(!name||name.trim()===old)return;let {error}=await supabaseClient.from("teams").update({name:name.trim()}).eq("id",id);if(error){toast("Ошибка: "+error.message);return}toast("Команда переименована");await loadData()}
async function setTeamActive(id,active){if(!active){let count=managerRows.filter(m=>m.active!==false&&m.team_id===id).length;if(count){toast("Сначала переведите активных менеджеров в другую команду");return}}let {error}=await supabaseClient.from("teams").update({active}).eq("id",id);if(error){toast("Ошибка: "+error.message);return}toast(active?"Команда восстановлена":"Команда отправлена в архив");await loadData()}
function showLeague(m,btn){document.querySelectorAll("#leagueTabs button").forEach(x=>x.classList.remove("on"));btn.classList.add("on");let r=ranks(m),tr=teamRanks(m);document.getElementById("leagueBox").innerHTML=`<div class="grid2"><div class="card"><div class="sectionhead"><h2>Менеджеры · ${metrics[m]}</h2></div><table class="table"><thead><tr><th>#</th><th>Менеджер</th><th>Команда</th><th>Значение</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x[0]}</b></td><td>${teamOf(x[0])}</td><td><b>${fmt(x[1][m])}</b></td></tr>`).join("")}</tbody></table></div><div class="card"><div class="sectionhead"><h2>Команды · ${metrics[m]}</h2></div><table class="table"><thead><tr><th>#</th><th>Команда</th><th>Сумма</th></tr></thead><tbody>${tr.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x[0]}</b></td><td><b>${fmt(x[1])}</b></td></tr>`).join("")}</tbody></table></div></div>`}
function showTeams(m,btn){document.querySelectorAll("#tTabs button").forEach(x=>x.classList.remove("on"));btn.classList.add("on");let tr=teamRanks(m);document.getElementById("teamsBox").innerHTML=`<div class="grid2">${tr.map((x,i)=>`<div class="card"><div class="eyebrow">#${i+1} · ${metrics[m]}</div><div class="big">${fmt(x[1])}</div><div class="leader"><b>${x[0]}</b> · ${(teams[x[0]]||[]).length} менеджеров</div></div>`).join("")}</div>`}
function showVersus(filter,btn){document.querySelectorAll("#vTabs button").forEach(x=>x.classList.remove("on"));btn.classList.add("on");let arr=data.versus.filter(x=>filter==="all"||x.metric===filter),wins={};arr.forEach(x=>{let a=Number(data.values[x.p1]?.[x.metric]||0),b=Number(data.values[x.p2]?.[x.metric]||0),w=a===b?"DRAW":a>b?x.p1:x.p2;if(w!=="DRAW")wins[w]=(wins[w]||0)+1});let winRank=Object.entries(wins).sort((a,b)=>b[1]-a[1]);document.getElementById("versusBox").innerHTML=`<div class="grid2"><div class="card"><div class="sectionhead"><h2>Матчи</h2></div>${arr.length?arr.map(x=>{let a=Number(data.values[x.p1]?.[x.metric]||0),b=Number(data.values[x.p2]?.[x.metric]||0),res=a===b?"НИЧЬЯ":a>b?`${x.p1} победил`:`${x.p2} победил`;return `<div class="card" style="margin-bottom:10px;background:#0c0e13"><div class="eyebrow">${metrics[x.metric]} · ${x.date||"—"}</div><div class="versus"><div class="duel"><div class="avatar">${x.p1[0]}</div><div><b>${x.p1}</b></div><div class="score">${fmt(a)}</div></div><div class="vs">VS</div><div class="duel"><div class="avatar">${x.p2[0]}</div><div><b>${x.p2}</b></div><div class="score">${fmt(b)}</div></div></div><div class="notice" style="margin-top:14px;text-align:center">${res}</div></div>`}).join(""):"<div class=\"empty\">Матчей пока нет.</div>"}</div><div class="card"><div class="sectionhead"><h2>Победы VERSUS</h2></div>${winRank.length?winRank.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)"><span><b>#${i+1}</b> &nbsp; ${x[0]}</span><b>${x[1]}</b></div>`).join(""):"<div class=\"empty\">Побед пока нет.</div>"}</div></div>`}
async function setResult(){let n=document.getElementById("aManager").value,m=document.getElementById("aMetric").value,v=Number(document.getElementById("aValue").value);if(!Number.isFinite(v)||v<0){toast("Введите корректное значение");return}let {error}=await supabaseClient.from(metricTables[m]).insert({manager_id:data.managerIds[n],value:v});if(error){console.error(error);toast("Ошибка: "+error.message);return}toast("Результат сохранён");await loadData()}
async function addVersus(){let p1=document.getElementById("v1").value,p2=document.getElementById("v2").value,m=document.getElementById("vMetric").value,date=document.getElementById("vDate").value;if(p1===p2){toast("Выберите двух разных менеджеров");return}if(!date){toast("Выберите дату");return}let {error}=await supabaseClient.from("versus").insert({manager1_id:data.managerIds[p1],manager2_id:data.managerIds[p2],metric:m,match_date:date,winner_id:null});if(error){console.error(error);toast("Ошибка: "+error.message);return}toast("VERSUS создан");await loadData()}
function bonusRecipient(b){if(b.targetType==="all")return "Все менеджеры";if(b.targetType==="team")return "Команда "+b.target;return b.target||"Менеджер"}
function updateBonusTarget(){let t=document.getElementById("bTargetType").value,f=document.getElementById("bTargetField");if(t==="all"){f.innerHTML='<label>Получатели</label><div class="notice">Бонус доступен всем менеджерам</div>';return}f.innerHTML=t==="team"?`<label>Команда</label><select id="bTarget">${Object.keys(teams).map(n=>`<option>${n}</option>`).join("")}</select>`:`<label>Менеджер</label><select id="bTarget">${Object.keys(data.values).map(n=>`<option>${n}</option>`).join("")}</select>`}
async function addBonus(){let targetType=document.getElementById("bTargetType").value,target=targetType==="all"?null:document.getElementById("bTarget").value,title=document.getElementById("bTitle").value.trim(),condition=document.getElementById("bCondition").value.trim(),reward=document.getElementById("bReward").value.trim(),dateTo=document.getElementById("bDateTo").value||null;if(!title){toast("Введите название бонуса");return}let {error}=await supabaseClient.from("bonuses").insert({recipient_type:targetType,manager_id:targetType==="manager"?data.managerIds[target]:null,team_id:targetType==="team"?data.teamIds[target]:null,title,condition,reward,end_date:dateTo,active:true});if(error){console.error(error);toast("Ошибка: "+error.message);return}toast("Бонус добавлен");await loadData()}
async function removeBonus(id){if(!confirm("Удалить этот бонус?"))return;let {error}=await supabaseClient.from("bonuses").delete().eq("id",id);if(error){console.error(error);toast("Ошибка: "+error.message);return}await loadData()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>location.hash=b.dataset.page);window.onhashchange=render;loadData().then(initAuth);
</script>
