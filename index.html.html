eader b{color:#fff}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{font-size:17px;margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button,.primary,.danger{padding:9px 13px;border-radius:9px;background:#171b24;color:#b9c0cb;border:1px solid var(--line)}.tabs button.on,.primary{background:linear-gradient(135deg,#8b5cf6,#6d42d8);color:#fff;border-color:rgba(139,92,246,.7);box-shadow:0 8px 24px rgba(139,92,246,.18)}.danger{background:rgba(255,85,119,.09);color:#ff9eb0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:#6f7889;font-size:10px;text-transform:uppercase;letter-spacing:1px}.rank{font-weight:950;width:42px}.rankBadge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#151923;color:#cdd4df;font-weight:900}.rankBadge.gold{background:rgba(246,183,60,.15);color:#ffd56d;border:1px solid rgba(246,183,60,.28)}.rankBadge.silver{background:rgba(180,190,205,.11);color:#dce2eb}.rankBadge.bronze{background:rgba(193,119,65,.13);color:#e5a06c}.bar{height:5px;background:#202530;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:20px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;background:#0a0c11;color:white;border:1px solid var(--line);border-radius:9px;padding:11px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:13px}.empty{color:var(--muted);padding:22px 0}.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}.duel{text-align:center}.avatar{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(145deg,#262034,#10131b);border:1px solid rgba(139,92,246,.45);font-weight:900}.score{font-size:28px;font-weight:950;margin-top:10px}.vs{font-weight:950;color:#657083;font-size:18px}.notice{padding:12px 14px;background:#0c1016;border:1px solid var(--line);border-radius:10px;color:#aab2bf;font-size:12px}.authbox{max-width:520px;margin:50px auto}.adminbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:16px}.userpill{padding:7px 10px;border:1px solid var(--line);border-radius:99px;color:#bfc6d2;font-size:12px}.mini{padding:7px 10px!important;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#151a23;border:1px solid var(--line);padding:12px 16px;border-radius:10px;display:none;z-index:20;box-shadow:var(--shadow)}.heroTitle{font-size:22px;font-weight:950}.homeGrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.8fr);gap:18px}.rankingCard{min-height:390px}.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.top3 .place{padding:16px 10px;text-align:center;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:14px}.place .num{font-size:24px;font-weight:950}.teamGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.teamCard{padding:16px;border-radius:15px;background:linear-gradient(145deg,#10141c,#090b10);border:1px solid var(--line)}.teamName{font-weight:900;font-size:15px}.teamValue{font-size:23px;font-weight:950;margin-top:10px}.subtle{font-size:11px;color:var(--muted)}@media(max-width:1100px){.homeGrid{grid-template-columns:1fr}.teamGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.side{width:70px}.logo{font-size:0}.logo:after{content:"BL";font-size:18px}.side nav button{font-size:0;justify-content:center}.side:after{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.grid3,.grid2,.teamGrid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
.monthbar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.monthBadge,.closedBadge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:1px}.monthBadge{background:rgba(246,183,60,.08);border:1px solid rgba(246,183,60,.25);color:#ffd77a}.closedBadge{background:rgba(255,85,119,.1);border:1px solid rgba(255,85,119,.3);color:#ff9eb0}.historyGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.monthCard{padding:16px;border-radius:15px;background:linear-gradient(145deg,#10141c,#090b10);border:1px solid var(--line)}.monthCard.current{border-color:rgba(246,183,60,.38)}.monthCard.locked{opacity:.88}.disabledBtn{opacity:.45;cursor:not-allowed!important}@media(max-width:1100px){.historyGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.historyGrid{grid-template-columns:1fr}}</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rffifgnxrdiacklahpau.supabase.co";
const SUPABASE_KEY="sb_publishable_b3shv7MabRAVeeEuXGyAYw_A0HA0e_Q";
let currentSession=null;
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const metrics={retention:"RETENTION",deposits:"DEPOSITS",tubes:"ТРУБКИ"};
const metricTables={retention:"retention",deposits:"deposits",tubes:"calls"};
let teams={},teamRows=[],managerRows=[];
let data={values:{},managerIds:{},teamIds:{},versus:[],bonuses:[],months:[],rawMetrics:{}};
let selectedMonthKey=getCurrentMonthKey();
function pad(n){return String(n).padStart(2,"0")}
function getCurrentMonthKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function currentMonth(){return getCurrentMonthKey()}
function monthLabel(key){let [y,m]=String(key).split("-").map(Number);return new Intl.DateTimeFormat("ru-RU",{month:"long",year:"numeric"}).format(new Date(y,m-1,1)).toUpperCase()}
function monthRange(key){let [y,m]=String(key).split("-").map(Number);let from=`${y}-${pad(m)}-01T00:00:00`;let d=new Date(y,m,1);return {from,to:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T00:00:00`}}
function monthOfDate(d){return String(d||"").slice(0,7)}
function fmt(v){return Number(v||0).toLocaleString("ru-RU")}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display="none",2600)}
function teamKey(n){return n.replace(/^Команда\s+/i,"")}
function teamOf(n){return Object.keys(teams).find(t=>(teams[t]||[]).includes(n))||"—"}
function isAdmin(){return !!currentSession}
function monthInfo(key=selectedMonthKey){return data.months.find(m=>m.month_key===key)||{month_key:key,label:monthLabel(key),closed:false}}
function monthClosed(key=selectedMonthKey){return !!monthInfo(key).closed}
function monthValues(key){let vals={};managerRows.forEach(m=>{if(m.active!==false)vals[m.name]={retention:0,deposits:0,tubes:0}});let r=monthRange(key);for(let m of Object.keys(metricTables)){let latest={};(data.rawMetrics[m]||[]).filter(x=>x.created_at>=r.from&&x.created_at<r.to).forEach(x=>latest[x.manager_id]=x);Object.values(latest).forEach(x=>{let n=managerRows.find(q=>q.id===x.manager_id)?.name;if(n)vals[n][m]=Number(x.value)||0})}return vals}
function ranks(m,key=selectedMonthKey){let vals=monthValues(key);return Object.entries(vals).sort((a,b)=>(b[1][m]||0)-(a[1][m]||0))}
function teamRanks(m,key=selectedMonthKey){let vals=monthValues(key);return Object.keys(teams).map(t=>[t,(teams[t]||[]).reduce((s,n)=>s+(Number(vals[n]?.[m])||0),0)]).sort((a,b)=>b[1]-a[1])}
async function ensureCurrentMonth(){let key=currentMonth();let {error}=await supabaseClient.from("league_months").upsert({month_key:key,label:monthLabel(key)},{onConflict:"month_key",ignoreDuplicates:true});if(error&&!/duplicate|conflict/i.test(error.message||""))throw error}
async function loadData(){try{await ensureCurrentMonth();let [tr,mr,rr,dr,cr,vr,br,mm]=await Promise.all([supabaseClient.from("teams").select("id,name,active").order("id"),supabaseClient.from("managers").select("id,name,team_id,active").order("id"),supabaseClient.from("retention").select("id,manager_id,value,created_at").order("created_at",{ascending:true}),supabaseClient.from("deposits").select("id,manager_id,value,created_at").order("created_at",{ascending:true}),supabaseClient.from("calls").select("id,manager_id,value,created_at").order("created_at",{ascending:true}),supabaseClient.from("versus").select("*").order("match_date",{ascending:false}),supabaseClient.from("bonuses").select("*").order("created_at",{ascending:false}),supabaseClient.from("league_months").select("*").order("month_key",{ascending:false})]);let errs=[tr,mr,rr,dr,cr,vr,br,mm].filter(x=>x.error);if(errs.length)throw new Error(errs.map(x=>x.error.message).join("; "));teamRows=tr.data||[];managerRows=mr.data||[];teams={};data.managerIds={};data.teamIds={};teamRows.forEach(t=>{let k=teamKey(t.name);teams[k]=[];data.teamIds[k]=t.id});managerRows.forEach(m=>{let t=teamRows.find(x=>x.id===m.team_id),k=t?teamKey(t.name):"Без команды";if(!teams[k])teams[k]=[];if(m.active!==false&&t?.active!==false)teams[k].push(m.name);data.managerIds[m.name]=m.id});data.rawMetrics={retention:rr.data||[],deposits:dr.data||[],tubes:cr.data||[]};data.months=(mm.data||[]).map(m=>({month_key:m.month_key,label:m.label||monthLabel(m.month_key),closed:!!m.closed,closed_at:m.closed_at||null}));if(!data.months.some(m=>m.month_key===currentMonth()))data.months.unshift({month_key:currentMonth(),label:monthLabel(currentMonth()),closed:false});data.versus=(vr.data||[]).map(v=>({id:v.id,p1:managerRows.find(m=>m.id===v.manager1_id)?.name,p2:managerRows.find(m=>m.id===v.manager2_id)?.name,metric:v.metric,date:v.match_date,closed:v.closed===true,closedAt:v.closed_at||null,winnerId:v.winner_id||null})).filter(v=>v.p1&&v.p2);data.bonuses=(br.data||[]).map(b=>({id:b.id,targetType:b.recipient_type,target:b.manager_id?managerRows.find(m=>m.id===b.manager_id)?.name:b.team_id?teamKey(teamRows.find(t=>t.id===b.team_id)?.name||""):null,title:b.title,condition:b.condition||"",reward:b.reward||"",dateTo:b.end_date||"",active:b.active!==false}));selectedMonthKey=currentMonth();render()}catch(e){console.error(e);document.getElementById("statusPill").textContent="SUPABASE · ERROR";document.getElementById("content").innerHTML=`<div class="card"><h2>Ошибка подключения</h2><div class="notice">${e.message}</div><div class="actions"><button class="primary" onclick="loadData()">Повторить</button></div></div>`}}
async function initAuth(){let {data:{session}}=await supabaseClient.auth.getSession();currentSession=session;render();supabaseClient.auth.onAuthStateChange((_e,s)=>{currentSession=s;render()})}
async function loginAdmin(){let email=document.getElementById("loginEmail")?.value.trim(),password=document.getElementById("loginPassword")?.value;if(!email||!password){toast("Введите email и пароль");return}let {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){toast("Ошибка входа: "+error.message);return}toast("Вход выполнен")}
async function logoutAdmin(){await supabaseClient.auth.signOut();toast("Вы вышли из админки")}
function loginPage(){return `<div class="card authbox"><div class="eyebrow">ADMIN ACCESS</div><h2>Вход в админку</h2><p class="leader">Введите данные администратора. Аккаунты создаются через Supabase.</p><div class="form"><div class="field full"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="admin@example.com"></div><div class="field full"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div></div><div class="actions"><button class="primary" onclick="loginAdmin()">Войти</button></div></div>`}
function monthSelectorHtml(){return `<div class="tabs" id="monthTabs">${data.months.map(m=>`<button class="${m.month_key===selectedMonthKey?"on":""}" onclick="selectMonth('${m.month_key}')">${m.label}${m.closed?' 🔒':''}</button>`).join("")}</div>`}
function selectMonth(k){selectedMonthKey=k;render()}
function renderHeader(){let cur=monthInfo(currentMonth()),lab=document.getElementById("currentMonthLabel"),st=document.getElementById("currentMonthStatus");if(lab)lab.textContent=cur.label;if(st)st.style.display=cur.closed?"inline-flex":"none"}
function render(){let page=location.hash.slice(1)||"home";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let titles={home:["BRO LEAGUE","Три независимых направления. Один рабочий дашборд."],league:["LEAGUE","История показателей по месяцам."],versus:["VERSUS","Личные дуэли с отдельным закрытием каждой дуэли."],bonuses:["БОНУСЫ","Активные бонусы менеджеров и команд."],teams:["КОМАНДЫ","Составы и показатели команд."],months:["ИСТОРИЯ МЕСЯЦЕВ","Архив показателей и статусы закрытия."],admin:["АДМИНКА","Управление данными, месяцами и администраторами."]};document.getElementById("pageTitle").textContent=titles[page]?.[0]||"BRO LEAGUE";document.getElementById("pageSub").textContent=titles[page]?.[1]||"";document.getElementById("statusPill").textContent=currentSession?"ADMIN · ONLINE":"LIVE DATA · SUPABASE";renderHeader();if(page==="admin"&&!isAdmin()){document.getElementById("content").innerHTML=loginPage();return}document.getElementById("content").innerHTML=pages[page]?pages[page]():pages.home();if(page==="league")document.querySelector("#leagueTabs button")?.click();if(page==="versus")document.querySelector("#vTabs button")?.click();if(page==="teams")document.querySelector("#tTabs button")?.click()}
const metricCard=m=>{let r=ranks(m),leader=r[0],sum=r.reduce((s,x)=>s+(Number(x[1][m])||0),0),icon=m==="retention"?"◈":m==="deposits"?"◆":"◉";return `<div class="card metric"><div class="metricHead"><div><div class="eyebrow">${metrics[m]}</div><div class="leader">Лидер месяца</div></div><div class="metricIcon">${icon}</div></div><div class="metricValue"><div class="big">${fmt(sum)}</div><div class="leader"><b>${leader?.[0]||"—"}</b> · ${fmt(leader?.[1]?.[m]||0)}</div></div></div>`}
const pages={
home:()=>{let r=ranks("retention"),d=ranks("deposits"),t=ranks("tubes"),top=r.slice(0,10),tr=teamRanks("retention").slice(0,6);let v=data.versus.find(x=>monthOfDate(x.date)===selectedMonthKey);let vals=monthValues(selectedMonthKey);let vs=v?`<div class="card"><div class="sectionhead"><h2>⚡ VERSUS</h2><span class="pill">${metrics[v.metric]} · ${v.date||"—"} ${v.closed?'· 🔒 ЗАКРЫТ':''}</span></div><div class="versus"><div class="duel"><div class="avatar">${v.p1[0]}</div><div><b>${v.p1}</b></div><div class="score">${fmt(vals[v.p1]?.[v.metric]||0)}</div></div><div class="vs">VS</div><div class="duel"><div class="avatar">${v.p2[0]}</div><div><b>${v.p2}</b></div><div class="score">${fmt(vals[v.p2]?.[v.metric]||0)}</div></div></div></div>`:`<div class="card"><div class="sectionhead"><h2>⚡ VERSUS</h2></div><div class="empty">Дуэлей пока нет.</div></div>`;return `<div class="grid3">${metricCard("retention")}${metricCard("deposits")}${metricCard("tubes")}</div><div class="section homeGrid"><div class="card rankingCard"><div class="sectionhead"><h2 class="heroTitle">♛ РЕЙТИНГ МЕНЕДЖЕРОВ</h2><span class="pill">${monthLabel(selectedMonthKey)}</span></div><table class="table"><thead><tr><th>#</th><th>Менеджер</th><th>Команда</th><th>RETENTION</th></tr></thead><tbody>${top.map((x,i)=>`<tr><td><span class="rankBadge ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i+1}</span></td><td><b>${x[0]}</b><div class="bar"><i style="width:${Math.max(2,(Number(x[1].retention)||0)/(Number(top[0]?.[1].retention)||1)*100)}%"></i></div></td><td>${teamOf(x[0])}</td><td><b>${fmt(x[1].retention)}</b></td></tr>`).join("")}</tbody></table></div><div><div class="card"><div class="sectionhead"><h2>🏆 TOP-3 МЕСЯЦА</h2></div><div class="top3">${r.slice(0,3).map((x,i)=>`<div class="place"><div class="subtle">#${i+1}</div><div class="num">${fmt(x[1].retention)}</div><div class="subtle">${x[0]}</div></div>`).join("")}</div></div><div class="section"><div class="sectionhead"><h2>🔥 ЛИДЕРЫ ПО НАПРАВЛЕНИЯМ</h2></div><div class="notice">RETENTION: <b>${r[0]?.[0]||"—"}</b> · ${fmt(r[0]?.[1]?.retention||0)}<br>DEPOSITS: <b>${d[0]?.[0]||"—"}</b> · ${fmt(d[0]?.[1]?.deposits||0)}<br>ТРУБКИ: <b>${t[0]?.[0]||"—"}</b> · ${fmt(t[0]?.[1]?.tubes||0)}</div></div></div></div><div class="section"><div class="sectionhead"><h2>🏢 КОМАНДЫ</h2><span class="pill">${monthLabel(selectedMonthKey)}</span></div><div class="teamGrid">${tr.map((x,i)=>`<div class="teamCard"><div class="subtle">#${i+1}</div><div class="teamName">${x[0]}</div><div class="teamValue">${fmt(x[1])}</div><div class="subtle">${(teams[x[0]]||[]).length} менеджеров</div></div>`).join("")}</div></div><div class="section grid2">${vs}<div class="card"><div class="sectionhead"><h2>🎁 АКТИВНЫЕ БОНУСЫ</h2></div><div class="heroTitle">${data.bonuses.filter(b=>b.active&&(!b.dateTo||b.dateTo>=new Date().toISOString().slice(0,10))).length}</div><div class="subtle">бонусов доступно сейчас</div></div></div>`},
league:()=>`${monthSelectorHtml()}<div class="tabs" id="leagueTabs">${Object.keys(metrics).map((m,i)=>`<button class="${i===0?'on':''}" onclick="showLeague('${m}',this)">${metrics[m]}</button>`).join("")}</div><div id="leagueBox" class="section"></div>`,
versus:()=>`${monthSelectorHtml()}<div class="tabs" id="vTabs">${["all",...Object.keys(metrics)].map((m,i)=>`<button class="${i===0?'on':''}" onclick="showVersus('${m}',this)">${m==="all"?"ВСЕ":metrics[m]}</button>`).join("")}</div><div id="versusBox" class="section"></div>`,
teams:()=>`${monthSelectorHtml()}<div class="tabs" id="tTabs">${Object.keys(metrics).map((m,i)=>`<button class="${i===0?'on':''}" onclick="showTeams('${m}',this)">${metrics[m]}</button>`).join("")}</div><div id="teamsBox" class="section"></div>`,
months:()=>`<div class="card"><div class="sectionhead"><h2>📚 История месяцев</h2><span class="pill">${data.months.length} месяцев</span></div><div class="notice" style="margin-bottom:14px">Месяцы не закрываются автоматически. Закрытые месяцы и их данные остаются в Supabase.</div><div class="historyGrid">${data.months.map(m=>`<div class="monthCard ${m.month_key===currentMonth()?'current':''} ${m.closed?'locked':''}"><div class="subtle">${m.month_key===currentMonth()?'CURRENT MONTH':'АРХИВ'}</div><h3>${m.label}</h3><div class="subtle">${m.closed?'🔒 Закрыт':'🟢 Открыт'}</div><div class="actions"><button class="primary mini" onclick="selectMonth('${m.month_key}');location.hash='league'">Смотреть показатели</button><button class="tabs button mini" onclick="selectMonth('${m.month_key}');location.hash='versus'">Смотреть VERSUS</button></div></div>`).join("")}</div></div>`,
bonuses:()=>`<div class="card"><div class="sectionhead"><h2>Активные бонусы</h2><span class="pill">ДЛЯ МЕНЕДЖЕРОВ И КОМАНД</span></div>${data.bonuses.filter(b=>b.active&&(!b.dateTo||b.dateTo>=new Date().toISOString().slice(0,10))).map(b=>`<div class="card" style="margin-bottom:10px;background:#0c0e13"><div class="eyebrow">${bonusRecipient(b)} · до ${b.dateTo||"бессрочно"}</div><div class="big" style="font-size:22px">${b.title}</div><div class="leader">${b.condition||"Условия не указаны"}</div><div style="margin-top:10px;font-weight:800">${b.reward||"Награда не указана"}</div></div>`).join("")||'<div class="empty">Активных бонусов пока нет.</div>'}</div>`,
admin:()=>{let open=data.versus.filter(x=>monthOfDate(x.date)===currentMonth());return `<div class="adminbar"><span class="userpill">${currentSession?.user?.email||"Администратор"}</span><button class="danger mini" onclick="logoutAdmin()">Выйти</button></div><div class="card"><div class="sectionhead"><h2>📅 Месяцы</h2><span class="pill">CURRENT: ${monthLabel(currentMonth())}</span></div><div class="notice" style="margin-bottom:14px">Месяц <b>не закрывается автоматически</b>. Администратор может вручную закрыть любой открытый месяц, включая текущий.</div><div class="historyGrid">${data.months.map(m=>`<div class="monthCard ${m.month_key===currentMonth()?'current':''} ${m.closed?'locked':''}"><div class="subtle">${m.month_key===currentMonth()?'CURRENT MONTH':'ИСТОРИЯ'}</div><h3>${m.label}</h3><div class="subtle">${m.closed?'🔒 Месяц закрыт':'🟢 Месяц открыт'}</div><div class="actions">${m.closed?`<button class="tabs button" onclick="selectMonth('${m.month_key}')">Открыть историю</button>`:`<button class="danger" onclick="closeMonth('${m.month_key}')">🔴 ЗАКРЫТЬ МЕСЯЦ</button>`}</div></div>`).join("")}</div></div><div class="section card"><div class="sectionhead"><h2>⚔️ VERSUS · управление</h2><span class="pill">ТЕКУЩИЙ МЕСЯЦ</span></div><div class="notice" style="margin-bottom:14px">У каждой открытой дуэли есть отдельная кнопка закрытия. После закрытия VERSUS изменить нельзя, а победа учитывается в статистике.</div>${open.length?open.map(x=>{let vals=monthValues(currentMonth()),a=Number(vals[x.p1]?.[x.metric]||0),b=Number(vals[x.p2]?.[x.metric]||0);return `<div style="display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)"><div><b>${x.p1} vs ${x.p2}</b><br><small style="color:var(--muted)">${metrics[x.metric]} · ${x.date||'—'} · ${fmt(a)} : ${fmt(b)}</small></div>${x.closed?'<span class="closedBadge">🔒 ЗАКРЫТ</span>':`<button class="danger mini" onclick="closeVersus(${x.id})">⚔️ ЗАКРЫТЬ VERSUS</button>`}</div>`}).join(""):'<div class="empty">В текущем месяце VERSUS пока нет.</div>'}</div><div class="grid2"><div class="card"><div class="sectionhead"><h2>Результат</h2><span class="pill">${monthLabel(currentMonth())}</span></div><div class="form"><div class="field"><label>Менеджер</label><select id="aManager">${activeManagers().map(n=>`<option>${n}</option>`).join("")}</select></div><div class="field"><label>Направление</label><select id="aMetric">${Object.entries(metrics).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div><div class="field full"><label>Значение</label><input id="aValue" type="number" min="0" placeholder="Введите значение"></div></div><div class="actions"><button class="primary" onclick="setResult()">Сохранить результат</button></div></div><div class="card"><div class="sectionhead"><h2>Создать VERSUS</h2></div><div class="form"><div class="field"><label>Менеджер 1</label><select id="v1">${activeManagers().map(n=>`<option>${n}</option>`).join("")}</select></div><div class="field"><label>Менеджер 2</label><select id="v2">${activeManagers().map(n=>`<option>${n}</option>`).join("")}</select></div><div class="field"><label>Направление</label><select id="vMetric">${Object.entries(metrics).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div><div class="field"><label>Дата</label><input id="vDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="actions"><button class="primary" onclick="addVersus()">Создать дуэль</button></div></div></div><div class="section card"><div class="sectionhead"><h2>Менеджеры</h2></div><div class="form"><div class="field"><label>Имя нового менеджера</label><input id="newManagerName" placeholder="Имя"></div><div class="field"><label>Команда</label><select id="newManagerTeam">${teamRows.filter(t=>t.active!==false).map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select></div></div><div class="actions"><button class="primary" onclick="addManager()">Добавить менеджера</button></div></div><div class="grid2 section"><div class="card"><div class="sectionhead"><h2>Команды</h2></div><div class="form"><div class="field full"><label>Название новой команды</label><input id="newTeamName" placeholder="Например: Команда Nova"></div></div><div class="actions"><button class="primary" onclick="addTeam()">Добавить команду</button></div></div><div class="card"><div class="sectionhead"><h2>Создать бонус</h2></div><div class="form"><div class="field"><label>Кому назначить</label><select id="bTargetType"><option value="manager">Конкретному менеджеру</option><option value="all">Всем менеджерам</option><option value="team">Целой команде</option></select></div><div class="field"><label>Название бонуса</label><input id="bTitle"></div><div class="field"><label>Награда</label><input id="bReward"></div><div class="field full"><label>Условие</label><input id="bCondition"></div><div class="field"><label>Дата окончания</label><input id="bDateTo" type="date"></div></div><div class="actions"><button class="primary" onclick="addBonus()">Добавить бонус</button></div></div></div>`},
};
function activeManagers(){return managerRows.filter(m=>m.active!==false&&teamRows.find(t=>t.id===m.team_id)?.active!==false).map(m=>m.name)}
function escapeJs(v){return String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
async function closeMonth(key){if(!isAdmin())return;let m=monthInfo(key);if(m.closed){toast("Месяц уже закрыт");return}if(!confirm(`Закрыть ${m.label}? Это действие блокирует изменения за месяц, но данные не удаляет.`))return;let {error}=await supabaseClient.from("league_months").update({closed:true,closed_at:new Date().toISOString()}).eq("month_key",key);if(error){toast("Ошибка: "+error.message);return}toast("Месяц закрыт");await loadData();selectedMonthKey=key;render()}
function versusWinner(x){if(!x.closed)return null;let vals=monthValues(monthOfDate(x.date)),a=Number(vals[x.p1]?.[x.metric]||0),b=Number(vals[x.p2]?.[x.metric]||0);return a===b?null:(a>b?x.p1:x.p2)}
function showLeague(m,btn){document.querySelectorAll("#leagueTabs button").forEach(x=>x.classList.remove("on"));btn.classList.add("on");let r=ranks(m),tr=teamRanks(m);document.getElementById("leagueBox").innerHTML=`<div class="grid2"><div class="card"><div class="sectionhead"><h2>Менеджеры · ${metrics[m]}</h2><span class="pill">${monthLabel(selectedMonthKey)}</span></div><table class="table"><thead><tr><th>#</th><th>Менеджер</th><th>Команда</th><th>Значение</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x[0]}</b></td><td>${teamOf(x[0])}</td><td><b>${fmt(x[1][m])}</b></td></tr>`).join("")}</tbody></table></div><div class="card"><div class="sectionhead"><h2>Команды · ${metrics[m]}</h2></div><table class="table"><tbody>${tr.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x[0]}</b></td><td><b>${fmt(x[1])}</b></td></tr>`).join("")}</tbody></table></div></div>`}
function showTeams(m,btn){document.querySelectorAll("#tTabs button").forEach(x=>x.classList.remove("on"));btn.classList.add("on");let tr=teamRanks(m);document.getElementById("teamsBox").innerHTML=`<div class="grid2">${tr.map((x,i)=>`<div class="card"><div class="eyebrow">#${i+1} · ${metrics[m]} · ${monthLabel(selectedMonthKey)}</div><div class="big">${fmt(x[1])}</div><div class="leader"><b>${x[0]}</b></div></div>`).join("")}</div>`}
function showVersus(filter,btn){document.querySelectorAll("#vTabs button").forEach(x=>x.classList.remove("on"));btn.classList.add("on");let arr=data.versus.filter(x=>monthOfDate(x.date)===selectedMonthKey&&(filter==="all"||x.metric===filter)),wins={};arr.forEach(x=>{let w=versusWinner(x);if(w)wins[w]=(wins[w]||0)+1});let winRank=Object.entries(wins).sort((a,b)=>b[1]-a[1]);document.getElementById("versusBox").innerHTML=`<div class="grid2"><div class="card"><div class="sectionhead"><h2>Матчи · ${monthLabel(selectedMonthKey)}</h2><span class="pill">${arr.filter(x=>x.closed).length} закрыто</span></div>${arr.length?arr.map(x=>{let vals=monthValues(selectedMonthKey),a=Number(vals[x.p1]?.[x.metric]||0),b=Number(vals[x.p2]?.[x.metric]||0);return `<div class="card" style="margin-bottom:10px;background:#0c0e13"><div class="sectionhead"><div class="eyebrow">${metrics[x.metric]} · ${x.date||"—"}</div>${x.closed?'<span class="closedBadge">🔒 ЗАКРЫТ</span>':'<span class="pill">OPEN</span>'}</div><div class="versus"><div class="duel"><div class="avatar">${x.p1[0]}</div><b>${x.p1}</b><div class="score">${fmt(a)}</div></div><div class="vs">VS</div><div class="duel"><div class="avatar">${x.p2[0]}</div><b>${x.p2}</b><div class="score">${fmt(b)}</div></div></div><div class="notice" style="margin-top:14px;text-align:center">${x.closed?(a===b?"НИЧЬЯ":a>b?`${x.p1} победил`:`${x.p2} победил`):"ОТКРЫТ — ПОБЕДА НЕ СЧИТАЕТСЯ"}</div>${isAdmin()&&!x.closed?`<div class="actions" style="justify-content:center"><button class="danger" onclick="closeVersus(${x.id})">⚔️ Закрыть VERSUS</button></div>`:""}</div>`}).join(""):'<div class="empty">Матчей за выбранный месяц пока нет.</div>'}</div><div class="card"><div class="sectionhead"><h2>🏆 Победы VERSUS</h2><span class="pill">ТОЛЬКО ЗАКРЫТЫЕ</span></div>${winRank.length?winRank.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)"><span><b>#${i+1}</b> ${x[0]}</span><b>${x[1]}</b></div>`).join(""):'<div class="empty">Побед по закрытым дуэлям пока нет.</div>'}</div></div>`}
async function closeVersus(id){if(!isAdmin())return;let x=data.versus.find(v=>v.id===id);if(!x||x.closed){toast("VERSUS уже закрыт");return}if(monthClosed(monthOfDate(x.date))){toast("Месяц закрыт — дуэль уже нельзя изменить");return}if(!confirm(`Закрыть VERSUS: ${x.p1} vs ${x.p2}? После закрытия изменить нельзя.`))return;let vals=monthValues(monthOfDate(x.date)),a=Number(vals[x.p1]?.[x.metric]||0),b=Number(vals[x.p2]?.[x.metric]||0),winner=a===b?null:(a>b?data.managerIds[x.p1]:data.managerIds[x.p2]);let {error}=await supabaseClient.from("versus").update({closed:true,closed_at:new Date().toISOString(),winner_id:winner}).eq("id",id).eq("closed",false);if(error){toast("Ошибка: "+error.message);return}toast("VERSUS закрыт");await loadData()}
async function setResult(){if(!isAdmin())return;let n=document.getElementById("aManager").value,m=document.getElementById("aMetric").value,v=Number(document.getElementById("aValue").value);if(!Number.isFinite(v)||v<0){toast("Введите корректное значение");return}if(monthClosed(currentMonth())){toast("Текущий месяц закрыт — изменения запрещены");return}let {error}=await supabaseClient.from(metricTables[m]).insert({manager_id:data.managerIds[n],value:v});if(error){toast("Ошибка: "+error.message);return}toast("Результат сохранён");await loadData()}
async function addVersus(){if(!isAdmin())return;let p1=document.getElementById("v1").value,p2=document.getElementById("v2").value,m=document.getElementById("vMetric").value,date=document.getElementById("vDate").value;if(p1===p2||!date){toast("Выберите двух разных менеджеров и дату");return}if(monthClosed(monthOfDate(date))){toast("Выбранный месяц закрыт");return}let {error}=await supabaseClient.from("versus").insert({manager1_id:data.managerIds[p1],manager2_id:data.managerIds[p2],metric:m,match_date:date,winner_id:null,closed:false});if(error){toast("Ошибка: "+error.message);return}toast("VERSUS создан");await loadData()}
async function addManager(){if(!isAdmin())return;let name=document.getElementById("newManagerName").value.trim(),teamId=Number(document.getElementById("newManagerTeam").value);if(!name||!teamId)return toast("Введите имя и команду");let {error}=await supabaseClient.from("managers").insert({name,team_id:teamId,active:true});if(error)return toast("Ошибка: "+error.message);await loadData()}
async function addTeam(){if(!isAdmin())return;let name=document.getElementById("newTeamName").value.trim();if(!name)return toast("Введите название команды");let {error}=await supabaseClient.from("teams").insert({name,active:true});if(error)return toast("Ошибка: "+error.message);await loadData()}
function bonusRecipient(b){if(b.targetType==="all")return "Все менеджеры";if(b.targetType==="team")return "Команда "+b.target;return b.target||"Менеджер"}
async function addBonus(){if(!isAdmin())return;let targetType=document.getElementById("bTargetType").value,title=document.getElementById("bTitle").value.trim(),condition=document.getElementById("bCondition").value.trim(),reward=document.getElementById("bReward").value.trim(),dateTo=document.getElementById("bDateTo").value||null;if(!title)return toast("Введите название бонуса");let {error}=await supabaseClient.from("bonuses").insert({recipient_type:targetType,title,condition,reward,end_date:dateTo,active:true});if(error)return toast("Ошибка: "+error.message);await loadData()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>location.hash=b.dataset.page);window.onhashchange=render;loadData().then(initAuth);
</script>
</body>
